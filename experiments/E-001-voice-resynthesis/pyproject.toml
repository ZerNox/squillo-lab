[project]
name = "e001-voice-resynthesis"
version = "0.1.0"
description = "E-001 round 1: re-synthesis of a sung phrase with pitch corrected or steadied"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyworld>=0.3.4",
    "praat-parselmouth>=0.4.5",
    "setuptools<81",  # pyworld 0.3.5 imports pkg_resources
]

[tool.uv]
package = false
