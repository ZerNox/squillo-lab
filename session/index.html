<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squillo lab session</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2230; --ink2: #545c6e; --muted: #8a91a1;
  --line: #dde1e8; --accent: #2f5bd3; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a5b00; --bad: #b3261e;
  --rec: #d0342c; --code: #eef0f4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b; --panel: #1c1f26; --ink: #e7e9ee; --ink2: #b3b9c6; --muted: #7d8494;
    --line: #2d313b; --accent: #7d9cff; --accent-ink: #0d1020; --ok: #5cc98e; --warn: #e0a64a; --bad: #ff8a80;
    --rec: #ff6b61; --code: #252932;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding-inline: 16px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 24px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: space-between; align-items: flex-start; }
header h1 { font-size: 22px; margin: 0 0 4px; }
.svc { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.svc button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink2); padding: 6px 10px; cursor: pointer; }
.svc button + button { border-left: 1px solid var(--line); }
.svc button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
a.b { text-decoration: none; display: inline-block; }
header p { margin: 0; color: var(--ink2); max-width: 70ch; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; display: flex; gap: 8px; align-items: center; }
nav button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.part { background: var(--warn); } .dot.done { background: var(--ok); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
section h2 { margin: 0 0 4px; font-size: 18px; }
.lead { color: var(--ink2); margin: 0 0 16px; max-width: 72ch; }
.step { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.step h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.b, a.b { font: inherit; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.p { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.r { background: var(--rec); color: #fff; border-color: var(--rec); }
button:disabled { opacity: .45; cursor: default; }
.take { display: grid; grid-template-columns: minmax(0, 14em) 1fr; gap: 6px 14px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.take:last-child { border-bottom: 0; }
.take .what b { display: block; } .take .what span { color: var(--ink2); font-size: 13px; }
@media (max-width: 640px) { .take { grid-template-columns: 1fr; } }
.meter { width: 120px; height: 8px; background: var(--code); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); }
.meter i.hot { background: var(--bad); }
.t { font-variant-numeric: tabular-nums; color: var(--ink2); min-width: 3.5em; }
audio { height: 32px; max-width: 100%; }
pre { background: var(--code); border-radius: 8px; padding: 10px; overflow: auto; max-height: 320px; font-size: 12.5px; margin: 8px 0 0; white-space: pre-wrap; }
textarea { width: 100%; min-height: 110px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl { overflow-x: auto; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type=number] { width: 8.5em; }
.scale { display: inline-flex; gap: 2px; }
.scale label { border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; cursor: pointer; font-variant-numeric: tabular-nums; }
.scale input { display: none; }
.scale input:checked + span { color: var(--accent); font-weight: 700; }
.note { font-size: 13px; color: var(--ink2); }
.warn { color: var(--warn); } .ok { color: var(--ok); } .bad { color: var(--bad); }
.big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.guide { padding: 8px 0 0; gap: 8px; }
.tips { background: var(--code); border-radius: 10px; padding: 12px 14px; margin: 4px 0 8px; font-size: 14px; }
.tips p { margin: 0 0 6px; } .tips ul { margin: 0 0 8px; padding-left: 20px; color: var(--ink2); }
code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 13px; }
</style>

<div class="wrap">
<header>
  <div>
  <h1>Squillo lab session</h1>
  <p>Five 15-minute human steps for <code>squillo-lab</code>. Recordings stay on this laptop in each experiment's
  <code>data/cache/human/</code>, which git ignores. <b>Commit</b> publishes only the listed numbers and notes, to a
  public repo, and only when you press it.</p>
  </div>
  <div class="svc" id="svc" role="group" aria-label="Listen on"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script src="/page/probe.js"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const j = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(j.error || j.log || r.status);
  return j;
};
const fileUrl = (exp, rel) => `/api/file/${exp}/${rel}?t=${Date.now()}`;
let S = {};  // server state
const refresh = async () => { S = await api("/api/state"); renderNav(); };
const has = (exp, rel) => !!S[exp]?.files[rel];

// ---------- CSV ----------
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const [head, ...rest] = rows.filter(r => r.length > 1 || r[0]);
  return { head, rows: rest.map(r => Object.fromEntries(head.map((k, i) => [k, r[i] ?? ""]))) };
}
const toCSV = (head, rows) => [head, ...rows.map(r => head.map(k => r[k] ?? ""))]
  .map(r => r.map(v => /[",\n\r]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")).join("\r\n") + "\r\n";

// ---------- jobs ----------
async function runTask(name, pre) {
  const { job } = await api(`/api/run/${name}`, { method: "POST" });
  for (;;) {
    const j = await api(`/api/job/${job}`);
    pre.textContent = j.log; pre.scrollTop = pre.scrollHeight;
    if (j.done) { if (j.rc !== 0) throw new Error(`${name} exited ${j.rc}`); return j; }
    await new Promise(r => setTimeout(r, 700));
  }
}
function taskButton(label, name, after, opts = {}) {
  const pre = h("pre", { hidden: true });
  const st = h("span", { class: "note" });
  const b = h("button", { class: "b p", onclick: async () => {
    b.disabled = true; pre.hidden = false; st.textContent = "running…"; st.className = "note";
    try { await runTask(name, pre); st.textContent = "done"; st.className = "note ok"; await refresh(); after && await after(); }
    catch (e) { st.textContent = String(e.message || e); st.className = "note bad"; }
    b.disabled = false;
  } }, label);
  if (opts.disabled) b.disabled = true;
  return h("div", {}, h("div", { class: "row" }, b, st), pre);
}

// ---------- recorder ----------
const RAW_REQ = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 };
const WORKLET = URL.createObjectURL(new Blob([`class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('rec',R)`], { type: "text/javascript" }));
function wav(chunks, sr) {
  const n = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + 2 * n), v = new DataView(buf);
  const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); v.setUint32(4, 36 + 2 * n, true); s(8, "WAVE"); s(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, 2 * sr, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data"); v.setUint32(40, 2 * n, true);
  let o = 44; for (const c of chunks) for (const x of c) { v.setInt16(o, Math.max(-1, Math.min(1, x)) * 32767, true); o += 2; }
  return new Blob([buf], { type: "audio/wav" });
}
let active = null;  // one recording at a time
function recorder(exp, name, what, detail, hintSeconds) {
  const rel = `data/cache/human/${name}`;
  const meter = h("i"), time = h("span", { class: "t" }, "0.0 s");
  const player = h("audio", { controls: true, preload: "none" });
  const st = h("span", { class: "note" });
  const showSaved = () => { if (has(exp, rel)) { player.src = fileUrl(exp, rel); st.textContent = "saved"; st.className = "note ok"; } };
  const btn = h("button", { class: "b r" }, "Record");
  btn.onclick = async () => {
    if (active && active !== btn) return;
    if (active === btn) return active.stop();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: RAW_REQ });
      const ctx = new AudioContext({ sampleRate: 48000 });
      await ctx.audioWorklet.addModule(WORKLET);
      const src = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, "rec");
      const chunks = []; let peak = 0; const t0 = performance.now();
      node.port.onmessage = (e) => { chunks.push(e.data); for (const x of e.data) peak = Math.max(peak, Math.abs(x)); };
      src.connect(node);
      const tick = setInterval(() => {
        time.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s";
        meter.style.width = Math.min(100, peak * 100) + "%"; meter.className = peak > 0.98 ? "hot" : ""; peak *= 0.6;
      }, 100);
      btn.textContent = "Stop"; active = btn; st.textContent = "recording…"; st.className = "note";
      btn.stop = async () => {
        clearInterval(tick); stream.getTracks().forEach(t => t.stop()); await ctx.close();
        active = null; btn.textContent = "Record again"; meter.style.width = "0";
        const blob = wav(chunks, ctx.sampleRate);
        await api(`/api/rec/${exp}/${name}`, { method: "POST", body: blob });
        await refresh(); showSaved();
      };
    } catch (e) { st.textContent = "microphone: " + e.message; st.className = "note bad"; active = null; }
  };
  const el = h("div", { class: "take" },
    h("div", { class: "what" }, h("b", {}, what), h("span", {}, detail + (hintSeconds ? ` · about ${hintSeconds} s` : ""))),
    h("div", { class: "row" }, btn, h("span", { class: "meter" }, meter), time, player, st));
  if (has(exp, rel)) { btn.textContent = "Record again"; showSaved(); }
  return el;
}

// ---------- commit ----------
function commitStep(exp) {
  const files = { "E-001": ["results/human/ratings.csv", "results/human/key.json"], "E-002": ["results/own_r4.json", "results/own_r4.md"],
    "E-003": ["results/human-chrome.json", "results/human-firefox.json"], "E-004": ["results/listen.csv"],
    "E-005": ["results/own.json", "results/own.md"] }[exp];
  const pre = h("pre", { hidden: true });
  const st = h("span", { class: "note" });
  const b = h("button", { class: "b p", onclick: async () => {
    b.disabled = true;
    try { const r = await api(`/api/commit/${exp}`, { method: "POST" }); pre.hidden = false; pre.textContent = r.log; st.textContent = `committed ${r.commit} and pushed`; st.className = "note ok"; await refresh(); }
    catch (e) { pre.hidden = false; pre.textContent = e.message; st.textContent = "failed"; st.className = "note bad"; }
    b.disabled = false;
  } }, "Commit and push");
  const pending = S[exp].pending;
  return h("div", { class: "step" }, h("h3", {}, "Commit"),
    h("p", { class: "note" }, "Publishes to the public squillo-lab repo: ", files.map((f, i) => [i ? ", " : "", h("code", {}, f)]),
      ". Never audio. Changed now: ", pending.length ? pending.join("; ") : "nothing"),
    h("div", { class: "row" }, b, st), pre);
}
function notesStep(exp, rel, prompt) {
  const ta = h("textarea", { placeholder: prompt });
  const st = h("span", { class: "note" });
  fetch(fileUrl(exp, rel)).then(r => r.ok ? r.text() : "").then(t => { if (t) ta.value = t; });
  const save = h("button", { class: "b p", onclick: async () => {
    await api(`/api/write/${exp}/${rel}`, { method: "POST", body: ta.value }); st.textContent = "saved"; st.className = "note ok"; await refresh();
  } }, "Save notes");
  return h("div", {}, ta, h("div", { class: "row" }, save, st));
}
async function showJSON(exp, rel, el) {
  const r = await fetch(fileUrl(exp, rel)); el.textContent = r.ok ? JSON.stringify(await r.json(), null, 1) : "not yet produced";
}

// ---------- listen-first guides ----------
// A tune is [semitones above the key note, length in eighths]. Played before a take,
// never during it: the protocols ask for unaccompanied takes, and the mic would hear it.
const TUNES = {
  row: { tempo: 150, notes: [[0,3],[0,3],[0,2],[2,1],[4,3],[4,2],[2,1],[4,2],[5,1],[7,6],
    [12,1],[12,1],[12,1],[7,1],[7,1],[7,1],[4,1],[4,1],[4,1],[0,1],[0,1],[0,1],[7,2],[5,1],[4,2],[2,1],[0,6]] },
  scale: { tempo: 110, notes: [0,2,4,5,7,9,11,12,11,9,7,5,4,2,0].map((s, i, a) => [s, i === a.length - 1 ? 4 : 2]) },
  hold: { tempo: 60, notes: [[4, 12]] },
};
const KEYS = [["A2", 45, "deep voice"], ["C3", 48, "most men"], ["E3", 52, "higher men / low women"], ["A3", 57, "most women"], ["C4", 60, "higher women"]];
let keyMidi = +(localStorageGet("key") || 48);
let playing = null, singer = null;
function stopAll() {
  if (playing) { playing.close(); playing = null; }
  if (singer) { singer.pause(); singer = null; }
}
// A real singer from VocalSet (CC BY 4.0), always in C: the men on C3, the women on C4.
// The voice follows the chosen key: A2 to E3 a man, A3 and C4 a woman.
function playSinger(tuneName, st) {
  stopAll();
  const a = new Audio(`/examples/${tuneName}-${keyMidi < 55 ? "m" : "f"}.wav`); singer = a;
  a.onerror = () => { st.textContent = "no example yet: run python3 session/examples.py once"; st.className = "note warn"; };
  a.play().catch(() => {});
}
// Listen elsewhere: a search on the chosen service for a recording of the guide in a voice
// near the chosen key. Searches, not fixed tracks, so no link rots and nothing is shipped.
const SERVICES = {
  youtube: ["YouTube", q => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`],
  spotify: ["Spotify", q => `https://open.spotify.com/search/${encodeURIComponent(q)}`],
  apple: ["Apple Music", q => `https://music.apple.com/search?term=${encodeURIComponent(q)}`],
};
const VOICE = { 45: "bass", 48: "baritone", 52: "tenor", 57: "alto", 60: "soprano" };
const QUERIES = {
  row: v => `Row Row Row Your Boat ${v} a cappella`,
  scale: v => `major scale ah vocal warm up ${v}`,
  hold: v => `sustained note vocal exercise ${v}`,
};
let service = SERVICES[localStorageGet("service")] ? localStorageGet("service") : "youtube";
function renderServices() {
  $("#svc").replaceChildren(...Object.entries(SERVICES).map(([k, [name]]) => h("button", { "aria-pressed": String(k === service),
    onclick: () => { service = k; localStorageSet("service", k); renderServices(); updateLinks(); } }, name)));
}
// Updated in place, so changing key or service never re-renders unsaved ratings or notes.
function updateLinks() {
  const [name, url] = SERVICES[service], voice = VOICE[keyMidi] || "";
  for (const a of document.querySelectorAll("a[data-tune]")) {
    a.href = url(QUERIES[a.dataset.tune](voice)); a.textContent = `↗ ${name} · ${voice}`;
    a.title = `Search ${name} for a ${voice} recording; close it before you record`;
  }
}
const serviceLink = tuneName => h("a", { class: "b", target: "_blank", rel: "noopener", "data-tune": tuneName });
function playTune(tune, onlyFirst) {
  stopAll();
  const ctx = new AudioContext(); playing = ctx;
  const beat = 60 / tune.tempo / 2; let t = ctx.currentTime + 0.1;
  const notes = onlyFirst ? [[tune.notes[0][0], 8]] : tune.notes;
  for (const [semi, len] of notes) {
    const f = 440 * 2 ** ((keyMidi + semi - 69) / 12), d = len * beat;
    const g = ctx.createGain(); g.connect(ctx.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.02); g.gain.setValueAtTime(0.18, t + d - 0.06); g.gain.linearRampToValueAtTime(0, t + d - 0.01);
    for (const [k, a] of [[1, 1], [2, 0.35], [3, 0.15]]) { const o = ctx.createOscillator(); const og = ctx.createGain(); og.gain.value = a; o.frequency.value = f * k; o.connect(og).connect(g); o.start(t); o.stop(t + d); }
    t += d;
  }
  setTimeout(() => { if (playing === ctx) { ctx.close(); playing = null; } }, (t - ctx.currentTime + 0.3) * 1000);
}
function keyPicker() {
  return h("label", { class: "note" }, "Your key: ", h("select", { onchange: e => { keyMidi = +e.target.value; localStorageSet("key", e.target.value);
    for (const s of document.querySelectorAll(".tips select")) s.value = e.target.value; updateLinks(); } },
    KEYS.map(([n, m, who]) => h("option", { value: m, selected: m === keyMidi }, `${n} · ${who}`))));
}
function guide(tuneName, label) {
  const tune = TUNES[tuneName], st = h("span", { class: "note" });
  return h("div", { class: "row guide" }, h("span", { class: "note" }, "Listen first:"),
    h("button", { class: "b", onclick: () => playSinger(tuneName, st) }, "▶ A real singer"),
    h("button", { class: "b", onclick: () => playTune(tune, true) }, "▶ Starting note"),
    tune.notes.length > 1 ? h("button", { class: "b", onclick: () => playTune(tune) }, `▶ ${label}`) : null,
    h("button", { class: "b", onclick: stopAll }, "■"), serviceLink(tuneName), st);
}
function tips(extra) {
  return h("div", { class: "tips" },
    h("p", {}, h("b", {}, "You don't need to be good at this. "),
      "Squillo measures you against what you were aiming for, not against the real tune, and an untrained voice is exactly the evidence the lab is missing. Off-key, drifting or a different key are all fine."),
    h("ul", {},
      h("li", {}, "Pick a key where the starting note feels easy to hum. Try another if it's too high or low."),
      h("li", {}, "Play the guide two or three times, humming along. Then stop it, play the starting note once, and sing on your own."),
      h("li", {}, "Headphones help, but never sing along with the guide: the takes must be you alone."),
      h("li", {}, "The ↗ link searches the service chosen top right for the same tune in a voice like your key (bass to soprano). Pick any version you like, listen, then close it before you press Record."),
      h("li", {}, "“A real singer” is a trained singer from the VocalSet recordings (Wilkins et al. 2018, CC BY 4.0), always in C, so not always your key: copy the shape and the sound, then take your pitch from “Starting note”. Their scale goes one note past the octave; yours can stop at the octave."),
      extra ? h("li", {}, extra) : null),
    keyPicker());
}

// ---------- the five tests ----------
const TESTS = [
{ id: "E-001", title: "Your voice, re-synthesized", time: "15 min · mic + headphones",
  done: () => has("E-001", "results/human/ratings.csv"),
  started: () => has("E-001", "data/cache/human/take1.wav"),
  render(root) {
    root.append(h("p", { class: "lead" }, "Does squillo's re-synthesis still sound like you, and natural? Record three takes, then rate 20 shuffled clips without knowing which is which (VISION §12.1)."));
    root.append(h("div", { class: "step" }, h("h3", {}, "1 · Record"),
      tips("For the few lines, the round below is fine; it is public domain and you'll sing it again in E-005."),
      guide("scale", "Scale"),
      recorder("E-001", "take1.wav", "A slow scale", 'on "ah", up and down', 10),
      guide("row", "Row, row, row your boat"),
      recorder("E-001", "take2.wav", "A few lines", "of a public-domain or self-written melody", 10),
      guide("hold", ""),
